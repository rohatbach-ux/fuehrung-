name: Podcasts aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"   # täglich ca. 05:17/06:17 Uhr deutscher Zeit
  workflow_dispatch:
  push:
    paths:
      - "feeds/**"
      - "scripts/fetch-feeds.mjs"
      - ".github/workflows/podcasts.yml"

permissions:
  contents: write

concurrency:
  group: podcasts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Feeds laden
        run: node scripts/fetch-feeds.mjs
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/podcasts.json
          if git diff --staged --quiet; then
            echo "Nichts zu speichern."
          else
            git commit -m "Podcasts aktualisieren"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
