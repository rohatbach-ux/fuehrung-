<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Führungskompass</title>
  <meta name="description" content="Führungsimpulse, Lernkarten, gespeicherte Beiträge und Podcasts für den Start als Leiter Instandhaltung">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kompass">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Heute</h1>
    <button class="icon-btn gear" data-act="settings" aria-label="Einstellungen">⚙️</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="player" class="player" hidden></div>

  <nav class="tabbar" aria-label="Bereiche">
    <button data-tab="heute"><span class="ico" aria-hidden="true">☀️</span>Heute</button>
    <button data-tab="lernen"><span class="ico" aria-hidden="true">📚</span>Lernen</button>
    <button data-tab="inbox"><span class="ico" aria-hidden="true">📥</span>Inbox</button>
    <button data-tab="hoeren"><span class="ico" aria-hidden="true">🎧</span>Hören</button>
    <button data-tab="journal"><span class="ico" aria-hidden="true">📓</span>Journal</button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
